<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for high-contrast visibility on dark and light browser chrome -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c19" />
    </linearGradient>
    <!-- Subtle leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00a84d" />
      <stop offset="100%" stop-color="#00873e" />
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Emblem Badge -->
  <circle cx="256" cy="256" r="246" fill="url(#emblemBg)" stroke="#10b981" stroke-width="12" filter="url(#badgeShadow)" />

  <!-- Scaled, perfectly centered Parthenium leaf and science flask -->
  <g transform="translate(256, 256) scale(0.44) translate(-500, -515)">
    <!-- High-Precision Parthenium Hysterophorus Leaf Silhouette -->
    <path
      d="M 500,74
         C 510,95 519,128 528,154
         C 544,138 572,116 592,132
         C 596,150 576,176 568,196
         C 596,180 624,170 640,190
         C 644,212 616,236 592,256
         C 628,248 670,244 688,272
         C 692,300 652,324 616,340
         C 648,336 688,340 708,368
         C 712,396 672,420 632,436
         C 668,444 712,464 716,500
         C 712,532 664,548 624,552
         C 664,568 732,600 736,648
         C 732,692 676,708 632,704
         C 668,728 720,772 704,820
         C 684,852 624,836 576,824
         C 596,852 612,884 584,912
         C 552,928 524,884 508,860
         C 506,892 508,936 500,956
         C 492,936 494,892 492,860
         C 476,884 448,928 416,912
         C 388,884 404,852 424,824
         C 376,836 316,852 296,820
         C 280,772 332,728 368,704
         C 324,708 268,692 264,648
         C 268,600 336,568 376,552
         C 336,548 288,532 284,500
         C 288,464 332,444 368,436
         C 328,420 288,396 292,368
         C 312,340 352,336 384,340
         C 348,324 308,300 312,272
         C 330,244 372,248 408,256
         C 384,236 356,212 360,190
         C 376,170 404,180 432,196
         C 424,176 404,150 408,132
         C 428,116 456,138 472,154
         C 481,128 490,95 500,74
         Z"
      fill="url(#leafGrad)"
    />

    <!-- Precision Scientific Erlenmeyer Flask in solid bright white -->
    <!-- Lip -->
    <rect x="442" y="416" width="116" height="24" rx="7" fill="#FFFFFF" />
    <!-- Neck -->
    <rect x="456" y="428" width="88" height="118" rx="2" fill="#FFFFFF" />
    <!-- Conical Body -->
    <polygon points="456,544 544,544 628,768 372,768" fill="#FFFFFF" />
    <!-- Rounded Base -->
    <rect x="370" y="750" width="260" height="40" rx="20" fill="#FFFFFF" />

    <!-- Laboratory graduation marks in botanical green -->
    <line x1="480" y1="623" x2="540" y2="623" stroke="#00873E" stroke-width="7" stroke-linecap="round" />
    <line x1="465" y1="668" x2="560" y2="668" stroke="#00873E" stroke-width="7" stroke-linecap="round" />
    <line x1="445" y1="713" x2="580" y2="713" stroke="#00873E" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
